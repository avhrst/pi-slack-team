<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1640" viewBox="0 0 1440 1640" xml:lang="en" role="img" aria-labelledby="title description">
  <title id="title">pi-slack-team — One team. Two runtimes.</title>
  <desc id="description">The tmux architecture connects Slack to separately owned manager and worker runtimes. Each has a bridge, serial queue, private interactive Pi and shared JSONL history. A root relay passes tasks and results using reciprocal peer permissions and, for Slack-origin tasks, both human allowlists. RPC instead separates history per DM user or channel thread. This diagram describes the code, not a live deployment.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#536779"/></marker>
  </defs>
  <style>
    text { font-family: 'DejaVu Sans', 'Arial', sans-serif; fill: #182f44; }
    .eyebrow { font-size: 17px; font-weight: 700; letter-spacing: 1.7px; fill: #486479; }
    .title { font-size: 51px; font-weight: 700; letter-spacing: -1.7px; }
    .sub { font-size: 22px; fill: #486479; }
    .heading { font-size: 29px; font-weight: 700; }
    .body { font-size: 21px; }
    .small { font-size: 17px; fill: #486479; }
    .mono { font-family: 'DejaVu Sans Mono', 'Courier New', monospace; font-size: 20px; }
    .flow { fill: none; stroke: #536779; stroke-width: 2; marker-end: url(#arrow); }
  </style>
  <rect width="1440" height="1640" fill="#f7f8fa"/>
  <rect x="0" width="12" height="1640" fill="#126b70"/>

<text x="64" y="55" class="eyebrow">PI-SLACK-TEAM / SYSTEM OVERVIEW</text>
<text x="64" y="121" class="title" data-key="title">One team. Two runtimes.</text>
<text x="64" y="166" class="sub" data-key="subtitle">Slack is the interface. Each Pi agent keeps its own Unix account.</text>
<path d="M64 201H1376" stroke="#d7dfe5"/>
<text x="64" y="240" class="eyebrow" data-key="section">01 / THE PERSISTENT TMUX TEAM</text>
<text x="1376" y="240" class="small" text-anchor="end" data-key="host">ONE LINUX HOST · PRIVATE SOCKET PER AGENT</text>
<rect x="280" y="271" width="880" height="91" rx="12" fill="#e4eff1"/>
<text x="720" y="307" class="heading" text-anchor="middle" data-key="human">People in Slack</text>
<text x="720" y="340" class="small" text-anchor="middle" data-key="human_sub">Allowed DMs and channel messages · each app applies its role policy</text>
<path d="M496 362 V384 H278 V407" class="flow"/>
<path d="M944 362 V384 H1162 V407" class="flow"/>
<rect x="64" y="410" width="428" height="435" rx="18" fill="#ffffff" stroke="#c6d4df" stroke-width="1.5"/>
<rect x="64" y="410" width="428" height="9" rx="4" fill="#126b70"/>
<text x="88" y="458" class="heading" data-key="manager">Manager</text>
<text x="468" y="457" class="small" text-anchor="end" data-key="account_a">Unix account A</text>
<text x="88" y="488" class="small" data-key="manager_role">Coordinates and delegates</text>
<path d="M88 505H468" stroke="#d7dfe5"/>
<text x="88" y="539" class="body" data-key="bridge">Dedicated Slack app + bridge</text>
<text x="88" y="567" class="small" data-key="checks">Identity → allowlist → deduplication</text>
<path d="M278 580 V602" class="flow"/>
<rect x="88" y="615" width="380" height="92" rx="10" fill="#e7f1f0"/>
<text x="278" y="649" class="body" text-anchor="middle" data-key="queue">One request at a time</text>
<text x="278" y="681" class="small" text-anchor="middle" data-key="pi">Interactive Pi in private tmux</text>
<path d="M278 716 V742" class="flow"/>
<text x="278" y="776" class="body" text-anchor="middle" data-key="history">One shared JSONL history</text>
<text x="278" y="810" class="mono" text-anchor="middle" data-key="history_file">tmux-agent.jsonl</text>
<rect x="948" y="410" width="428" height="435" rx="18" fill="#ffffff" stroke="#c6d4df" stroke-width="1.5"/>
<rect x="948" y="410" width="428" height="9" rx="4" fill="#126b70"/>
<text x="972" y="458" class="heading" data-key="worker">Worker</text>
<text x="1352" y="457" class="small" text-anchor="end" data-key="account_b">Unix account B</text>
<text x="972" y="488" class="small" data-key="worker_role">Executes specialist tasks</text>
<path d="M972 505H1352" stroke="#d7dfe5"/>
<text x="972" y="539" class="body" data-key="bridge">Dedicated Slack app + bridge</text>
<text x="972" y="567" class="small" data-key="checks">Identity → allowlist → deduplication</text>
<path d="M1162 580 V602" class="flow"/>
<rect x="972" y="615" width="380" height="92" rx="10" fill="#e7f1f0"/>
<text x="1162" y="649" class="body" text-anchor="middle" data-key="queue">One request at a time</text>
<text x="1162" y="681" class="small" text-anchor="middle" data-key="pi">Interactive Pi in private tmux</text>
<path d="M1162 716 V742" class="flow"/>
<text x="1162" y="776" class="body" text-anchor="middle" data-key="history">One shared JSONL history</text>
<text x="1162" y="810" class="mono" text-anchor="middle" data-key="history_file">tmux-agent.jsonl</text>
<rect x="540" y="479" width="360" height="262" rx="18" fill="#eeedf6"/>
<text x="720" y="520" class="heading" text-anchor="middle" data-key="relay">Local relay</text>
<text x="720" y="550" class="small" text-anchor="middle" data-key="root">Runs as root</text>
<text x="720" y="590" class="body" text-anchor="middle" data-key="acl">Reciprocal peer permissions</text>
<text x="720" y="624" class="body" text-anchor="middle" data-key="allowlists">Both human allowlists*</text>
<text x="720" y="658" class="body" text-anchor="middle" data-key="buffers">Bounded JSON buffers</text>
<text x="720" y="702" class="mono" text-anchor="middle">load-buffer / wait-for</text>
<path d="M492 627 H537" class="flow"/>
<path d="M900 627 H945" class="flow"/>
<path d="M540 695 H495" class="flow"/>
<path d="M948 695 H903" class="flow"/>
<text x="720" y="454" class="small" text-anchor="middle" data-key="task">task →</text>
<text x="720" y="773" class="small" text-anchor="middle" data-key="result">← result</text>
<text x="64" y="879" class="small" data-key="footnote">* For Slack-origin delegation. Local TUI requests retain their local origin.</text>
<text x="64" y="910" class="small" data-key="return">The worker result returns to the manager’s waiting tool, then to the original Slack conversation.</text>
<rect x="64" y="947" width="1312" height="111" rx="12" fill="#f6eacb"/>
<text x="88" y="990" class="heading" data-key="boundary">Shared history ≠ user isolation</text>
<text x="88" y="1026" class="small" data-key="boundary_sub">tmux shares context across users and threads. Current sender metadata controls request authorization.</text>
<text x="64" y="1107" class="eyebrow" data-key="compare">02 / CHOOSE THE CONTEXT BOUNDARY</text>
<text x="64" y="1157" class="heading" style="fill:#126b70">tmux</text>
<text x="196" y="1155" class="small" data-key="tmux_sub">Explicit opt-in</text>
<circle cx="69" cy="1188" r="4" fill="#126b70"/>
<text x="87" y="1195" class="body" data-key="t1">1 persistent Pi process / agent</text>
<circle cx="69" cy="1227" r="4" fill="#126b70"/>
<text x="87" y="1234" class="body" data-key="t2">1 shared history / agent</text>
<circle cx="69" cy="1266" r="4" fill="#126b70"/>
<text x="87" y="1273" class="body" data-key="t3">Serial requests; no idle hibernation</text>
<circle cx="69" cy="1305" r="4" fill="#126b70"/>
<text x="87" y="1312" class="body" data-key="t4">Delegation: DM, channel or local TUI</text>
<text x="744" y="1157" class="heading" style="fill:#574d83">RPC</text>
<text x="876" y="1155" class="small" data-key="rpc_sub">Default transport</text>
<circle cx="749" cy="1188" r="4" fill="#574d83"/>
<text x="767" y="1195" class="body" data-key="r1">Pi process / active logical session</text>
<circle cx="749" cy="1227" r="4" fill="#574d83"/>
<text x="767" y="1234" class="body" data-key="r2">History / DM user or channel thread</text>
<circle cx="749" cy="1266" r="4" fill="#574d83"/>
<text x="767" y="1273" class="body" data-key="r3">4 concurrent turns by default; idle hibernation</text>
<circle cx="749" cy="1305" r="4" fill="#574d83"/>
<text x="767" y="1312" class="body" data-key="r4">Delegation: shared Slack channel only</text>
<path d="M64 1341H1376" stroke="#d7dfe5"/>
<text x="64" y="1382" class="eyebrow" data-key="operator">03 / OBSERVE THE REAL AGENT</text>
<text x="64" y="1424" class="mono">pi-team list</text>
<text x="64" y="1455" class="small" data-key="list">Team status</text>
<text x="510" y="1424" class="mono">pi-team watch &lt;agent&gt;</text>
<text x="510" y="1455" class="small" data-key="watch">Read-only terminal</text>
<text x="966" y="1424" class="mono">pi-team attach &lt;agent&gt;</text>
<text x="966" y="1455" class="small" data-key="attach">Interactive access</text>
<text x="64" y="1520" class="small" data-key="restart">JSONL survives restart. In-flight work is not silently replayed; executed actions are not undone.</text>
<path d="M64 1550H1376" stroke="#d7dfe5"/>
<text x="64" y="1593" class="small" data-key="footer">Source-based overview · v0.1.0 · f01d764 · 2026-09-12 · Full contract: docs/guide.en.md</text>
<text x="1376" y="1593" class="eyebrow" text-anchor="end">EN</text>
