display_information:
  name: Pinet Dev
  description: Development coordinator, project manager, and specialist router.
  background_color: "#2457a6"
  long_description: >-
    Pinet Dev coordinates engineering work, manages Jira and Confluence context,
    routes implementation to specialist agents, tracks progress, and reports
    results. Each Slack thread uses an isolated persistent Pi session.

features:
  bot_user:
    display_name: Pinet Dev
    always_online: true
  agent_view:
    agent_description: Engineering coordinator, Atlassian project manager, and agent router.
    suggested_prompts:
      - title: Coordinate a task
        message: Analyze this request and coordinate it with the appropriate specialist.
      - title: Work with Jira
        message: Review or create the Jira work needed for this request.
      - title: Gather project context
        message: Find the relevant Jira and Confluence context and propose the next steps.
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false

oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - assistant:write
      - channels:history
      - chat:write
      - groups:history
      - im:history

settings:
  event_subscriptions:
    bot_events:
      - app_home_opened
      - app_mention
      - message.im
  interactivity:
    is_enabled: false
  socket_mode_enabled: true
  org_deploy_enabled: false
  token_rotation_enabled: false
