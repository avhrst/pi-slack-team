display_information:
  name: REPLACE Agent
  description: Dedicated Slack interface for one Pi agent.
  background_color: "#1f2d3d"

features:
  bot_user:
    display_name: REPLACE Agent
    always_online: true
  agent_view:
    agent_description: Communicate with the dedicated Pi agent.
    suggested_prompts: []
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false

oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - assistant:write
      - chat:write
      - im:history
      - im:read
      - im:write

settings:
  event_subscriptions:
    bot_events:
      - app_home_opened
      - app_mention
      - assistant_thread_started
      - message.im
  interactivity:
    is_enabled: true
  socket_mode_enabled: true
  org_deploy_enabled: false
  token_rotation_enabled: false
