display_information:
  name: Pinet Support
  description: Dedicated Pi support agent for troubleshooting, triage, and responses.
  background_color: "#87390c"
  long_description: >-
    Pinet Support is a friendly Pi-powered support agent. Ask me to troubleshoot
    an issue, triage an incident, summarize evidence, or draft a response.
    Each Slack conversation runs in its own isolated Pi session.

features:
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false

  bot_user:
    display_name: Pinet Support
    always_online: true

  agent_view:
    agent_description: Support agent for troubleshooting, triage, and customer responses.
    suggested_prompts:
      - title: Triage an issue
        message: Help me triage a support issue.
      - title: Troubleshoot
        message: Help me diagnose a technical problem.
      - title: Draft a reply
        message: Help me draft a clear support response.

oauth_config:
  scopes:
    bot:
      - assistant:write
      - chat:write
      - im:history

settings:
  event_subscriptions:
    bot_events:
      - app_home_opened
      - message.im

  interactivity:
    is_enabled: false

  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
