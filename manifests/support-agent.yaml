display_information:
  name: Pinet Support
  description: Infrastructure support, monitoring, diagnostics, and incident response.
  background_color: "#87390c"
  long_description: >-
    Pinet Support diagnoses server, Linux, Oracle, ORDS, service, and monitoring
    incidents. Send a direct message or mention the agent in a channel. Each
    Slack thread uses an isolated persistent Pi session.

features:
  bot_user:
    display_name: Pinet Support
    always_online: true
  agent_view:
    agent_description: Infrastructure support, monitoring, and incident diagnostics.
    suggested_prompts:
      - title: Check server health
        message: Check the current health of the affected servers and summarize any issues.
      - title: Investigate an incident
        message: Help me investigate this infrastructure incident.
      - title: Diagnose ORDS
        message: Diagnose this Oracle ORDS or REST API issue.
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false

oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - assistant:write
      - channels:history
      - chat:write
      - groups:history
      - im:history

settings:
  event_subscriptions:
    bot_events:
      - app_home_opened
      - app_mention
      - message.im
  interactivity:
    is_enabled: false
  socket_mode_enabled: true
  org_deploy_enabled: false
  token_rotation_enabled: false
