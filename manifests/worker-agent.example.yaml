display_information:
  name: Example Pi Worker
  description: On-demand Pi agent for direct messages and explicit channel mentions.
  background_color: "#1f2d3d"
  long_description: >-
    Example Pi Worker connects one Slack app to one Linux-isolated Pi agent.
    It responds to authorized direct messages and explicit channel mentions.
    Each Slack thread maps to a separate persistent Pi session.

features:
  bot_user:
    display_name: Example Pi Worker
    always_online: true
  agent_view:
    agent_description: Ask the dedicated Pi worker to handle an explicit task.
    suggested_prompts:
      - title: Ask the worker
        message: Help me with this task.
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false

oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - assistant:write
      - channels:history
      - chat:write
      - groups:history
      - im:history
      # Add files:read only when slack.fileUploads is explicitly enabled.

settings:
  event_subscriptions:
    bot_events:
      - app_home_opened
      - app_mention
      - assistant_thread_started
      - message.im
  interactivity:
    is_enabled: false
  socket_mode_enabled: true
  org_deploy_enabled: false
  token_rotation_enabled: false
