version: 1
agentId: msboard
role: worker
expectedUnixUser: msboard-agent
stateDir: /home/msboard-agent/.local/state/pi-slack-team

slack:
  # Synthetic IDs: replace all three values for the target workspace/app/user.
  teamId: T0000000000
  appId: A0000000000
  allowedUserIds:
    - U0000000000
  progressMode: raw
  fileUploads: false
  maxFileBytes: 20971520
  maxFilesPerMessage: 5

# Reciprocal identity of the dev manager allowed to delegate implementation.
interAgent:
  peers:
    - agentId: dev
      role: manager
      appId: A00000000000
      botUserId: U00000000000

pi:
  command: /usr/bin/pi
  cwd: /home/msboard-agent/ms-dashboard
  agentDir: /home/msboard-agent/.pi/agent
  sessionDir: /home/msboard-agent/.pi/agent/sessions
  maxActiveSessions: 1
  idleTimeoutMs: 300000
  requestTimeoutMs: 30000

# Production credentials are loaded from systemd:
#   $CREDENTIALS_DIRECTORY/slack_bot_token
#   $CREDENTIALS_DIRECTORY/slack_app_token
