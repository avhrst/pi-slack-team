version: 1
agentId: dev
role: manager
expectedUnixUser: dev-agent
stateDir: /home/dev-agent/.local/state/pi-slack-team

slack:
  # Synthetic IDs: replace all three values for the target workspace/app/user.
  teamId: T0000000000
  appId: A0000000000
  # Manager observations remain restricted to explicitly authorized humans.
  allowedUserIds:
    - U0000000000
  progressMode: summary

# Replace each synthetic peer identity and configure the reciprocal dev peer on
# that worker before enabling delegation.
interAgent:
  peers:
    - agentId: deploy
      role: worker
      appId: A00000000000
      botUserId: U00000000000
    - agentId: msboard
      role: worker
      appId: A000000000000
      botUserId: U000000000000
    - agentId: support
      role: worker
      appId: A0000000000000
      botUserId: U0000000000000

pi:
  command: /usr/bin/pi
  cwd: /home/dev-agent
  agentDir: /home/dev-agent/.pi/agent
  sessionDir: /home/dev-agent/.pi/agent/sessions
  maxActiveSessions: 1
  idleTimeoutMs: 300000

# The Slack app must subscribe to message.channels and message.groups in
# addition to the worker events. Production credentials are loaded from:
#   $CREDENTIALS_DIRECTORY/slack_bot_token
#   $CREDENTIALS_DIRECTORY/slack_app_token
