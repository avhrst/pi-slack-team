version: 1
agentId: deploy
role: worker
expectedUnixUser: deploy-agent
stateDir: /home/deploy-agent/.local/state/pi-slack-team

slack:
  teamId: T0123456789
  appId: A0123456789
  allowedUserIds:
    - U0123456789
  progressMode: summary
  # Requires the files:read scope included in manifests/deploy-agent.yaml.
  fileUploads: true
  maxFileBytes: 20971520
  maxFilesPerMessage: 5

pi:
  command: /usr/bin/pi
  cwd: /home/deploy-agent/ms-app-update
  agentDir: /home/deploy-agent/.pi/agent
  sessionDir: /home/deploy-agent/.pi/agent/sessions
  maxActiveSessions: 1
  idleTimeoutMs: 300000

# Production credentials are loaded from systemd:
#   $CREDENTIALS_DIRECTORY/slack_bot_token
#   $CREDENTIALS_DIRECTORY/slack_app_token
