version: 1
agentId: example-worker
role: worker
expectedUnixUser: pi-worker
stateDir: /home/pi-worker/.local/state/pi-slack-team

slack:
  # Synthetic IDs: replace all three values for the target workspace/app/user.
  teamId: T0000000000
  appId: A0000000000
  allowedUserIds:
    - U0000000000
  # summary hides tool arguments/output; raw exposes them in Slack.
  progressMode: summary
  fileUploads: false
  maxFileBytes: 20971520
  maxFilesPerMessage: 5

# Optional, fail-closed acceptance of delegated requests from this manager.
# appId and botUserId must both match the bot-authored app_mention event.
interAgent:
  peers:
    - agentId: example-manager
      role: manager
      appId: A00000000000
      botUserId: U00000000000
  requestTimeoutMs: 900000
  maxTaskChars: 30000
  maxResponseChars: 50000

pi:
  command: /usr/bin/pi
  cwd: /home/pi-worker
  agentDir: /home/pi-worker/.pi/agent
  sessionDir: /home/pi-worker/.pi/agent/sessions
  maxConcurrentTurns: 4
  maxResidentProcesses: 8
  idleTimeoutMs: 300000
  requestTimeoutMs: 30000

# Production credentials are loaded from systemd:
#   $CREDENTIALS_DIRECTORY/slack_bot_token
#   $CREDENTIALS_DIRECTORY/slack_app_token
#
# For local development only, point to owner-readable absolute paths:
# credentials:
#   botTokenFile: /secure/path/slack_bot_token
#   appTokenFile: /secure/path/slack_app_token
